<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhishScope v0.2</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui;background:#06101c;color:#e8f2ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#173a64,#06101c 42%);min-height:100vh}main{max-width:1250px;margin:auto;padding:35px 20px 70px}.hero,.card{background:#0a1829e8;border:1px solid #214666;border-radius:18px;box-shadow:0 18px 55px #0005}.hero{padding:28px}.brand{display:flex;justify-content:space-between;gap:20px;align-items:start}.tag{font-size:12px;letter-spacing:2px;color:#62d9ff;font-weight:800}h1{font-size:44px;margin:5px 0}.muted{color:#8eacc6}.drop{margin-top:20px;padding:25px;border:1px dashed #3e769e;border-radius:14px;background:#071321}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px;margin-top:14px}.card{padding:17px}.score{font-size:50px;font-weight:900}.critical{color:#ff7272}.high{color:#ffad66}.medium{color:#ffd86b}.low{color:#7ce6aa}button,select,input[type=file]{margin:5px}button,select{background:#1687d3;color:white;border:1px solid #42a6e8;padding:10px 14px;border-radius:9px;font-weight:700;cursor:pointer}button.secondary,select{background:#102a40}pre{white-space:pre-wrap;word-break:break-word;color:#b8d7ef;max-height:280px;overflow:auto;font-size:12px}ul{padding-left:18px}.pill{display:inline-block;border:1px solid #315c7d;border-radius:20px;padding:4px 9px;margin:3px;font-size:12px}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:12px}textarea{width:100%;min-height:85px;background:#06111e;color:#dcecff;border:1px solid #315674;border-radius:9px;padding:10px}.case{cursor:pointer}.case:hover{border-color:#4e9acb}a{color:#6dd8ff}.split{display:grid;grid-template-columns:2fr 1fr;gap:14px}@media(max-width:800px){.split{grid-template-columns:1fr}.brand{display:block}}
</style></head><body><main><section class="hero"><div class="brand"><div><div class="tag">DEFENSIVE SECURITY RESEARCH</div><h1>PhishScope <span class="muted">v0.2</span></h1><div class="muted">Phishing Investigation & Threat Intelligence Platform</div></div><div id="health" class="pill">checking services…</div></div><div class="drop"><input id="f" type="file" accept=".eml"><button onclick="analyze()">Analyze Email</button><span id="status" class="muted">Evidence stays on this server.</span></div></section><div class="split"><div id="out"></div><div><div class="card" style="margin-top:14px"><b>Recent Cases</b><div id="cases" class="muted">Loading…</div></div></div></div></main><script>
let current=null;const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(u,o){let r=await fetch(u,o),ct=r.headers.get('content-type')||'';let d=ct.includes('json')?await r.json():await r.text();if(!r.ok)throw Error(d.detail||d);return d}
async function analyze(){let f=document.querySelector('#f').files[0];if(!f)return;status.textContent='Analyzing…';let fd=new FormData();fd.append('file',f);try{render(await api('/api/analyze',{method:'POST',body:fd}));status.textContent='Case created';loadCases()}catch(e){status.textContent=e.message}}
function list(a){return a?.length?a.map(x=>'<li>'+E(typeof x==='string'?x:(x.id+' — '+x.name))+'</li>').join(''):'<li class="muted">None</li>'}
function render(d){current=d;out.innerHTML=`<div class="grid"><div class="card"><div class="muted">Risk score</div><div class="score ${E(d.severity)}">${d.risk_score}</div><b>${E(d.severity).toUpperCase()}</b></div><div class="card"><b>Case</b><pre>${E(d.case_id)}\n${E(d.filename)}\n${E(d.file_sha256)}</pre></div><div class="card"><b>Findings</b><ul>${list(d.findings)}</ul></div><div class="card"><b>MITRE ATT&CK</b><ul>${list(d.mitre)}</ul></div></div><div class="grid"><div class="card"><b>URLs</b><pre>${E(d.urls.join('\n')||'None')}</pre></div><div class="card"><b>Domains</b><pre>${E(d.domains.join('\n')||'None')}</pre></div><div class="card"><b>Public IPs</b><pre>${E(d.ips.join('\n')||'None')}</pre></div><div class="card"><b>Attachments</b><pre>${E(d.attachments.map(a=>a.filename+'\n'+a.sha256).join('\n\n')||'None')}</pre></div></div><div class="card" style="margin-top:14px"><b>Investigation Actions</b><div class="toolbar"><button onclick="enrich()">Passive Enrichment</button><button class="secondary" onclick="artifact('sigma')">Sigma</button><button class="secondary" onclick="artifact('yara')">YARA</button><button class="secondary" onclick="artifact('stix')">STIX 2.1</button><select id="cs" onchange="setStatus()"><option>new</option><option>investigating</option><option>contained</option><option>closed</option></select></div><div id="intel"></div><textarea id="note" placeholder="Analyst note…"></textarea><button onclick="addNote()">Add Note</button><div id="notes">${(d.notes||[]).map(n=>'<p><span class="muted">'+E(n.created_utc)+'</span><br>'+E(n.text)+'</p>').join('')}</div></div>`;document.querySelector('#cs').value=d.status||'new';if(Object.keys(d.enrichment||{}).length)showIntel(d.enrichment)}
async function enrich(){intel.innerHTML='<p class="muted">Running passive RDAP, certificate transparency and optional VirusTotal enrichment…</p>';try{showIntel(await api('/api/cases/'+current.case_id+'/enrich',{method:'POST'}))}catch(e){intel.textContent=e.message}}
function showIntel(x){intel.innerHTML='<h3>Passive Intelligence</h3><pre>'+E(JSON.stringify(x,null,2))+'</pre>'}
async function artifact(t){let d=await api('/api/cases/'+current.case_id+'/'+t);let txt=typeof d==='string'?d:JSON.stringify(d,null,2);let w=window.open();w.document.write('<pre>'+E(txt)+'</pre>')}
async function addNote(){let t=note.value.trim();if(!t)return;let n=await api('/api/cases/'+current.case_id+'/notes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})});current.notes=n;render(current)}
async function setStatus(){await api('/api/cases/'+current.case_id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:cs.value})});current.status=cs.value}
async function loadCases(){let a=await api('/api/cases');cases.innerHTML=a.length?a.slice(0,12).map(c=>`<div class="case" onclick="openCase('${E(c.case_id)}')"><p><b>${E(c.case_id)}</b> <span class="pill ${E(c.severity)}">${E(c.risk_score)}</span><br><span class="muted">${E(c.filename)} · ${E(c.status)}</span></p></div>`).join(''):'No cases yet'}
async function openCase(id){render(await api('/api/cases/'+id))}
(async()=>{try{let h=await api('/api/health');health.textContent='VT '+(h.virustotal_configured?'configured':'optional / off')}catch{};loadCases()})();
</script></body></html>
